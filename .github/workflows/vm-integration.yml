name: VM Integration

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: test-spk

    env:
      GOCACHE: /tmp/go-build
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      SPKTOOL_VERSION: v0.0.3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1
        id: lima-actions-setup

      - name: Cache ~/.cache/lima
        uses: actions/cache@v4
        with:
          path: ~/.cache/lima
          key: lima-${{ steps.lima-actions-setup.outputs.version }}

      - name: Restore Sandstorm signing keyring
        env:
          SANDSTORM_KEYRING_B64: ${{ secrets.SANDSTORM_TESTAPP_KEYRING_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SANDSTORM_KEYRING_B64:-}" ]; then
            echo "::error::Missing required secret SANDSTORM_TESTAPP_KEYRING_B64"
            exit 1
          fi
          mkdir -p "$HOME/.sandstorm/caches"
          printf '%s' "$SANDSTORM_KEYRING_B64" | base64 --decode > "$HOME/.sandstorm/sandstorm-keyring"
          chmod 600 "$HOME/.sandstorm/sandstorm-keyring"

      - name: Download spktool
        run: |
          set -euo pipefail
          mkdir -p /tmp/spktool
          curl -fsSL "https://github.com/mnutt/spktool/releases/download/${SPKTOOL_VERSION}/spktool_${SPKTOOL_VERSION}_linux_amd64.tar.gz" \
            | tar -C /tmp/spktool -xzf -
          chmod +x /tmp/spktool/spktool

      - name: Add spktool to PATH
        run: echo "/tmp/spktool" >> "$GITHUB_PATH"

      - name: Initialize Lima VM
        run: spktool --provider lima vm create

      - name: Provision Lima VM
        run: spktool --provider lima vm provision

      - name: Build testapp inside Lima
        run: spktool --provider lima vm ssh -- /bin/sh -lc 'cd /opt/app && /opt/app/.sandstorm/build.sh'

      - name: Run VM-backed app-harness integration test
        env:
          SANDSTORM_VM_INTEGRATION: "1"
          SPKTOOL: spktool
        run: |
          set -euo pipefail
          GOCACHE=/tmp/go-build go test -v ./scripts -run TestGrainHarnessServePkgDefInVM -count=1
