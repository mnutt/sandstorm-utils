name: Release Linux amd64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label to use in the Linux amd64 release artifact name
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      GOCACHE: /tmp/go-build
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  package:
    needs: verify
    runs-on: ubuntu-latest

    env:
      GOCACHE: /tmp/go-build
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate utility manifest
        run: make manifest

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            version="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="manual-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package Linux amd64 release archive
        run: make package VERSION=${{ steps.meta.outputs.version }} GOOS=linux GOARCH=amd64

      - name: Upload Linux amd64 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandstorm-utils_${{ steps.meta.outputs.version }}_linux_amd64
          path: dist/release/sandstorm-utils_${{ steps.meta.outputs.version }}_linux_amd64.tar.gz
          if-no-files-found: error

      - name: Upload utility manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandstorm-utils_utils_manifest_${{ steps.meta.outputs.version }}
          path: manifest/utils.json
          if-no-files-found: error

      - name: Attach Linux amd64 asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/sandstorm-utils_${{ steps.meta.outputs.version }}_linux_amd64.tar.gz
            manifest/utils.json
