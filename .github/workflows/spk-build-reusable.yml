name: SPK Build Reusable

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      spk_output_path:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
    secrets:
      sandstorm_keyring_b64:
        required: true

jobs:
  build-spk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment_name }}

    env:
      GOCACHE: /tmp/go-build
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run host-side tests
        run: make test

      - name: Run host-side build check
        run: make build

      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1
        id: lima-actions-setup

      - name: Cache ~/.cache/lima
        uses: actions/cache@v4
        with:
          path: ~/.cache/lima
          key: lima-${{ steps.lima-actions-setup.outputs.version }}

      - name: Restore Sandstorm signing keyring
        env:
          SANDSTORM_KEYRING_B64: ${{ secrets.sandstorm_keyring_b64 }}
        run: |
          set -euo pipefail
          if [ -z "${SANDSTORM_KEYRING_B64:-}" ]; then
            echo "::error::Missing required secret sandstorm_keyring_b64"
            exit 1
          fi
          mkdir -p "$HOME/.sandstorm"
          printf '%s' "$SANDSTORM_KEYRING_B64" | base64 --decode > "$HOME/.sandstorm/sandstorm-keyring"
          chmod 600 "$HOME/.sandstorm/sandstorm-keyring"

      - name: Download lima-spk
        run: git clone --branch spk-pack-dev https://github.com/mnutt/vagrant-spk /tmp/vagrant-spk

      - name: Add /tmp/vagrant-spk to PATH
        run: echo "/tmp/vagrant-spk" >> "$GITHUB_PATH"

      - name: Initialize Lima VM
        run: /tmp/vagrant-spk/lima-spk vm up

      - name: Provision Lima VM
        run: /tmp/vagrant-spk/lima-spk vm provision

      - name: Inspect mounted app tree
        run: printf "pwd\nls -la /opt/app\nls -la /opt/app/testapp || true\nwhich go || true\nwhich spk || true\nexit\n" | lima-spk vm ssh

      - name: Build testapp inside Lima
        run: printf "cd /opt/app && /opt/app/.sandstorm/build.sh\nexit\n" | lima-spk vm ssh

      - name: Build SPK
        run: |
          set -euo pipefail
          mkdir -p build
          lima-spk pack "${{ inputs.spk_output_path }}"

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.spk_output_path }}
          if-no-files-found: error
